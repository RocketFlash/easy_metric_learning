type: faiss
n_workers: ${n_workers}
faiss_gpu: False
save_results: False

index_type: hnsw
nlist: 4096
nprobe: 32
hnsw_m: 32

rerank:
  enabled: False
  # k-reciprocal re-ranking builds dense NxN distances; keep disabled for
  # million-scale galleries unless a chunked variant is added.
  k1: 20
  k2: 6
  lambda_value: 0.3
