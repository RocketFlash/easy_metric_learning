defaults:
  - default
  - _self_

train:
  order:
    [
      resize,
      randaugment,
      horizontal_flip,
      random_rotate90,
      shift_scale_rotate,
      random_brightness_contrast,
      blur,
      random_erasing,
      normalize,
      to_tensor
    ]
  randaugment:
    _target_: src.transform.torchvision_policy.TorchvisionPolicy
    policy: randaugment
    num_ops: 2
    magnitude: 9
    p: 0.5
  random_erasing:
    _target_: src.transform.torchvision_policy.RandomErasing
    scale: [0.02, 0.2]
    ratio: [0.3, 3.3]
    fill: 0
    p: 0.25
