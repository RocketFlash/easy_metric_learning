defaults:
  - default
  - _self_

train:
  order:
    [
      resize,
      augmix,
      horizontal_flip,
      random_brightness_contrast,
      random_erasing,
      normalize,
      to_tensor
    ]
  augmix:
    _target_: src.transform.torchvision_policy.TorchvisionPolicy
    policy: augmix
    severity: 3
    mixture_width: 3
    chain_depth: -1
    alpha: 1.0
    p: 0.5
  random_erasing:
    _target_: src.transform.torchvision_policy.RandomErasing
    scale: [0.02, 0.2]
    ratio: [0.3, 3.3]
    fill: 0
    p: 0.25
