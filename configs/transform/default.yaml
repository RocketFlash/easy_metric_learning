train:
  order:
    [
      resize,
      horizontal_flip,
      random_rotate90,
      shift_scale_rotate,
      random_brightness_contrast,
      blur,
      coarse_dropout,
      gauss_noise,
      clahe,
      togray,
      sharpen,
      iso_noise,
      motion_blur,
      normalize,
      to_tensor
    ]
  resize:
    _target_: albumentations.Resize
    height: ${img_h}
    width: ${img_w}
    p: 1.0
  horizontal_flip:
    _target_: albumentations.HorizontalFlip
    p: 0.5
  random_rotate90:
    _target_: albumentations.RandomRotate90
    p: 0.5
  shift_scale_rotate:
    _target_: albumentations.ShiftScaleRotate
    scale_limit: 0.1 
    rotate_limit: [-15, 15]
    shift_limit: 0.05
    border_mode: 2
    p: 0.2
  clahe:
    _target_: albumentations.CLAHE
    p: 0.05
  togray:
    _target_: albumentations.ToGray
    p: 0.05
  sharpen:
    _target_: albumentations.Sharpen
    p: 0.05
  random_brightness_contrast:
    _target_ : albumentations.RandomBrightnessContrast
    brightness_limit: [-0.15, 0.15]
    contrast_limit: [-0.15, 0.15]
    p: 0.1
  blur:
    _target_ : albumentations.Blur
    blur_limit: [3, 5]
    p: 0.1
  coarse_dropout:
    _target_ : src.transform.albumentations_compat.coarse_dropout
    num_holes_range: [4, 8]
    hole_height_range: [20, 40]
    hole_width_range: [20, 40]
    p: 0.2
  gauss_noise:
    _target_ : albumentations.GaussNoise
    var_limit: [10.0, 50.0]
    p: 0.1
  iso_noise:
    _target_ : albumentations.ISONoise
    intensity: [0.1, 0.5]
    color_shift: [0.01, 0.05]
    p: 0.05
  motion_blur:
    _target_ : albumentations.MotionBlur
    blur_limit: [3, 5]
    p: 0.05
  normalize:
    _target_: albumentations.Normalize
    mean: ${backbone.norm_mean}
    std: ${backbone.norm_std}
    p: 1.0
  to_tensor:
    _target_: albumentations.pytorch.ToTensorV2

valid:
  order:
    [
      resize,
      normalize,
      to_tensor
    ]
  resize:
    _target_: albumentations.Resize
    height: ${img_h}
    width: ${img_w}
    p: 1.0
  normalize:
    _target_: albumentations.Normalize
    mean: ${backbone.norm_mean}
    std: ${backbone.norm_std}
    p: 1.0
  to_tensor:
    _target_: albumentations.pytorch.ToTensorV2

test:
  order:
    [
      resize,
      normalize,
      to_tensor
    ]
  resize:
    _target_: albumentations.Resize
    height: ${img_h}
    width: ${img_w}
    p: 1.0
  normalize:
    _target_: albumentations.Normalize
    mean: ${backbone.norm_mean}
    std: ${backbone.norm_std}
    p: 1.0
  to_tensor:
    _target_: albumentations.pytorch.ToTensorV2

cutmix:
  p: 0
  alpha: 0.5

mixup:
  p: 0
  alpha: 0.5

transface_dpap:
  enabled: False
  patch_grid: [12, 12]
  top_k: 7
  probability: 0.2
  alpha: 1.0
  ratio: 1.0

maintain_aspect_ratio: False
